version: '3.8'

services:
  backend:
    build: .
    container_name: trafficvision-backend
    ports:
      - "8000:8000"
    volumes:
      - ./temp:/app/temp
    env_file:
      - .env
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
